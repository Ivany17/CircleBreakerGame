<!DOCTYPE html>
<html>
<head>
    <title>Circle Breaker - Підготовка</title>
    <style>
        body {
            margin: 0;
            overflow: hidden; /* ховаємо смуги прокрутки */
            font-family: Arial, sans-serif;
        }
        canvas {
            display: block; /* прибирає зайві відступи */
            background-color: #0a0a2a; /* темно-синє небо */
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0,0,0,0.7);
            padding: 8px 15px;
            border-radius: 10px;
            pointer-events: none; /* щоб текст не заважав клікам */
        }
    </style>
</head>
<body>
    <div id="info">
        Гра "Підготовка до Circle Breaker"<br>
        Натисніть ⬆ (стрілка вгору) або Enter, щоб запустити кулю
    </div>
    <canvas id="gameCanvas"></canvas>

    <script>
        // Тут буде наш JavaScript код
        console.log("Сторінка завантажена!");
    </script>
</body>
</html>
